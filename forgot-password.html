<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lupa Password | 2KA22</title>
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/login.css" />
</head>

<body>
  <main class="section">
    <div class="container">
      <div class="row full-height justify-content-center">
        <div class="col-12 text-center align-self-center py-5">
          <section class="reset-card mx-auto text-center" aria-labelledby="reset-title">
            <p class="reset-brand">2KA22</p>
            <h1 id="reset-title">Lupa password?</h1>
            <p class="reset-description">Masukkan email terdaftar untuk memulihkan akses akun Anda.</p>

            <form id="reset-form">
              <label class="reset-label" for="reset-email">Email</label>
              <div class="form-group">
                <input class="form-style" type="email" id="reset-email" name="email"
                  placeholder="you@example.com" autocomplete="email" required>
                <i class="input-icon uil uil-envelope" aria-hidden="true"></i>
              </div>
              <button class="btn mt-4" type="submit">Kirim Link Reset</button>
              <p class="reset-notice" id="reset-notice" role="status" aria-live="polite" hidden>
                Pengiriman email reset belum tersedia. Silakan hubungi admin kelas untuk bantuan.
              </p>
            </form>

            <p class="reset-return">Ingat password? <a class="link" href="login.html">Kembali ke Login</a></p>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="assets/js/forgot-password.js"></script>
</body>

</html>
